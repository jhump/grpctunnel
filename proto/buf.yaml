version: v2
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - DEFAULT
  except:
    # we intentionally break this convention since tunnels are symmetric
    # so that request/response messages are re-used but reversed
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # the names of the ProtocolRevision enum values predate the use of buf
    # lint and can't be changed without breaking generated code
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - FILE
